name: Bundle MediaPipe locally for FitCoach
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fitcoach-vendor.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned MediaPipe package and pose model
        shell: bash
        run: |
          set -euo pipefail
          tempdir="$(mktemp -d)"
          npm pack @mediapipe/tasks-vision@0.10.22 --pack-destination "$tempdir" --loglevel info
          tar -xzf "$tempdir/mediapipe-tasks-vision-0.10.22.tgz" -C "$tempdir"
          mkdir -p fitcoach/vendor/wasm fitcoach/vendor/models
          cp "$tempdir/package/vision_bundle.mjs" fitcoach/vendor/vision_bundle.mjs
          cp "$tempdir"/package/wasm/* fitcoach/vendor/wasm/
          if [[ -f "$tempdir/package/LICENSE" ]]; then
            cp "$tempdir/package/LICENSE" fitcoach/vendor/LICENSE
          fi
          curl --retry 4 --retry-delay 2 --fail --location --show-error \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" \
            --output fitcoach/vendor/models/pose_landmarker_lite.task
          test -s fitcoach/vendor/vision_bundle.mjs
          test -s fitcoach/vendor/wasm/vision_wasm_internal.wasm
          test -s fitcoach/vendor/wasm/vision_wasm_internal.js
          test -s fitcoach/vendor/models/pose_landmarker_lite.task
          du -h fitcoach/vendor/vision_bundle.mjs fitcoach/vendor/models/pose_landmarker_lite.task
          find fitcoach/vendor/wasm -maxdepth 1 -type f -printf '%f %k KB\n'
      - name: Commit self-hosted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fitcoach/vendor/
          if ! git diff --cached --quiet; then
            git commit -m "Vendor MediaPipe JS, WASM and pose model for Safari"
            git push origin HEAD:main
          fi
